name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-debug:
    if: (!startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenChat-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
      - name: Build Release APK
        env:
          KEYSTORE_PATH: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk OpenChat-${{ github.ref_name }}.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenChat ${{ github.ref_name }}"
          body: "Auto-built release APK"
          files: OpenChat-${{ github.ref_name }}.apk
