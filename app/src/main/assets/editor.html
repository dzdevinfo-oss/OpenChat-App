<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #container { width: 100%; height: 100%; }
    </style>
    <!-- Use unpkg to load Monaco -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://unpkg.com/monaco-editor@0.36.1/min/vs/editor/editor.main.css">
</head>
<body>
<div id="container"></div>

<script>var require = { paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' } };</script>
<script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
<script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/editor/editor.main.nls.js"></script>
<script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/editor/editor.main.js"></script>
<script>
    var currentEditor = null;
    
    // Interface to Android
    function updateContent(content, language) {
        if (currentEditor) {
            monaco.editor.setModelLanguage(currentEditor.getModel(), language);
            currentEditor.setValue(content);
        } else {
            initEditor(content, language);
        }
    }

    function initEditor(initialContent, language) {
        currentEditor = monaco.editor.create(document.getElementById('container'), {
            value: initialContent,
            language: language,
            theme: 'vs-dark',
            automaticLayout: true,
            minimap: { enabled: false }
        });

        currentEditor.onDidChangeModelContent(function(e) {
            // Send updates back to Android
            if (window.AndroidInterface) {
                window.AndroidInterface.onContentChanged(currentEditor.getValue());
            }
        });
    }

    // Call Android once ready
    window.onload = function() {
        if (window.AndroidInterface) {
            window.AndroidInterface.onEditorReady();
        } else {
            // For local preview
            initEditor('// Hello Monaco', 'javascript');
        }
    };
</script>
</body>
</html>
